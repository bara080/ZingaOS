<!doctype html>
<html lang="en">
<head><base href="/console/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zinga OS — Neural Map</title>
<style>
  :root{
    --bg:#05060a; --panel:rgba(12,16,22,.72); --line:rgba(47,217,201,.22);
    --ink:#E7EBF1; --ink2:#8f9aa8; --ink3:#5a636f;
    --teal:#2FD9C9; --teal2:#7CFCEC; --red:#E0655A; --amber:#E6B24C;
    --blue:#5E9BE8; --green:#4FD08A; --slate:#8B96A6; --orange:#E8925A;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body,#root{height:100%;margin:0;}
  body{background:radial-gradient(1200px 800px at 50% 42%,#0a1016 0%,var(--bg) 70%);
    color:var(--ink);font-family:var(--sans);overflow:hidden;}
  #stage{position:fixed;inset:0;}

  .os-nav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:4px;
    padding:9px 16px;font-family:var(--mono);
    background:linear-gradient(180deg,rgba(5,6,10,.9),rgba(5,6,10,0));}
  .os-nav .brand{font-size:12px;letter-spacing:.16em;color:var(--ink);margin-right:14px;display:flex;align-items:center;gap:7px;}
  .os-nav .brand .d{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal);}
  .os-nav a{font-size:11.5px;letter-spacing:.05em;color:var(--ink2);text-decoration:none;padding:6px 11px;border-radius:7px;}
  .os-nav a:hover{color:var(--ink);background:rgba(47,217,201,.08);}
  .os-nav a[aria-current="page"]{color:var(--bg);background:var(--teal);font-weight:600;}

  .hud{position:fixed;z-index:20;font-family:var(--mono);pointer-events:none;}
  .hud *{pointer-events:auto;}
  .title{left:16px;top:48px;}
  .title h1{margin:0;font-size:15px;letter-spacing:.22em;font-weight:600;text-shadow:0 0 18px rgba(47,217,201,.5);}
  .title .sub{font-size:10.5px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase;margin-top:3px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;backdrop-filter:blur(10px);
    box-shadow:0 0 30px rgba(0,0,0,.5), inset 0 0 20px rgba(47,217,201,.03);}

  .controls{right:16px;top:48px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);backdrop-filter:blur(10px);}
  .seg button{all:unset;font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:6px 10px;color:var(--ink2);cursor:pointer;text-transform:uppercase;}
  .seg button[data-on="1"]{background:var(--teal);color:var(--bg);font-weight:600;}
  .seg button:not([data-on="1"]):hover{color:var(--ink);}
  .row{display:flex;gap:8px;}
  .btn{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;
    border:1px solid var(--line);border-radius:8px;background:var(--panel);backdrop-filter:blur(10px);color:var(--ink2);cursor:pointer;}
  .btn:hover{color:var(--ink);border-color:var(--teal);}
  .btn[data-on="1"]{color:var(--teal);border-color:var(--teal);}

  .legend{left:16px;bottom:16px;padding:12px 13px;min-width:186px;}
  .legend .h{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;}
  .legend .r{display:flex;align-items:center;gap:9px;font-size:11.5px;padding:2.5px 0;color:var(--ink);}
  .legend .r .sw{width:9px;height:9px;border-radius:50%;}
  .legend .r .ct{margin-left:auto;color:var(--ink2);font-variant-numeric:tabular-nums;}
  .legend .r .em{color:var(--red);margin-left:6px;}

  .detail{right:16px;bottom:16px;width:290px;padding:14px;}
  .detail .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);}
  .detail h3{margin:3px 0 6px;font-size:16px;}
  .detail .pill{display:inline-block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px;font-weight:600;margin-bottom:8px;}
  .detail p{margin:0;font-size:12.5px;line-height:1.55;color:var(--ink2);font-family:var(--sans);}
  .detail .hint{color:var(--ink3);font-size:12px;}

  .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;
    font-family:var(--mono);color:var(--ink2);gap:14px;}
  .boot .spin{width:34px;height:34px;border-radius:50%;border:2px solid rgba(47,217,201,.2);border-top-color:var(--teal);animation:sp 1s linear infinite;}
  .boot .t{font-size:11px;letter-spacing:.18em;text-transform:uppercase;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .boot.err .spin{display:none;} .boot.err .t{color:var(--red);}
  @media (max-width:720px){ .legend,.detail{display:none;} .title{top:44px;} }
</style>
</head>
<body>
<nav class="os-nav">
  <span class="brand"><span class="d"></span>ZINGA&nbsp;OS</span>
  <a href="graph.html">Knowledge&nbsp;Graph</a>
  <a href="tree.html">System&nbsp;Tree</a>
  <a href="#" aria-current="page">Neural&nbsp;Map</a>
  <a href="/operator">Operator</a>
</nav>

<div id="boot" class="boot"><div class="spin"></div><div class="t">initializing neural map…</div></div>
<div id="root"></div>

<script>
  // Fallback if the bundle fails to load or throws before the canvas paints.
  window.addEventListener('error', function (e) {
    if (document.querySelector('canvas')) return;
    var boot = document.getElementById('boot');
    if (!boot) return;
    boot.className = 'boot err';
    boot.innerHTML = '<div class="t">neural map failed to load</div>' +
      '<div style="font-size:11px;color:#5a636f;max-width:60ch;text-align:center;line-height:1.6">' +
      String((e && e.message) || e) +
      '<br><br>Open the <a href="graph.html" style="color:#2FD9C9">Knowledge Graph</a> for the 2D view.</div>';
  });
</script>
<script type="module" src="neural.bundle.js"></script>
</body>
</html>
