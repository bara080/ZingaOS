# Zinga OS automation layer — one always-on host.
#
# n8n now ships as a Docker Hardened Image (distroless Alpine, no package manager),
# so we can NO LONGER bake git/Claude into it. Instead we decouple (matches
# finalArchitecture.md): n8n = ORCHESTRATION ONLY (stock image); a separate WORKER
# image (Debian + git + python + Claude Code) runs `claude -p` against /repo.
#
#   cd automations/docker && docker compose up -d --build
#   # n8n listens on 127.0.0.1:5678 (Caddy fronts it with HTTPS — added later)
#   # run Claude in the worker:  docker exec -it zinga-worker bash
#
# Interim: until the real worker loop is built, `zinga-worker` idles (sleep infinity)
# so you can `docker exec` in and run `cd /repo && claude -p "/outreach-run ..."`.

services:
  n8n:
    image: docker.io/n8nio/n8n:latest      # stock hardened image — orchestration only
    container_name: zinga-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"              # localhost only; Caddy proxies to it
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=America/New_York
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PROXY_HOPS=1                    # trust Caddy as the TLS-terminating proxy
    volumes:
      - n8n_data:/home/node/.n8n           # workflows, credentials, encryption key

  caddy:
    image: caddy:2
    container_name: zinga-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                    # persists the Let's Encrypt cert
      - caddy_config:/config
    depends_on:
      - n8n

  worker:
    build: .                                # Debian + git + python3 + Claude Code CLI
    container_name: zinga-worker
    restart: unless-stopped
    working_dir: /repo
    command: ["sleep", "infinity"]          # interim: idle; exec in to run claude
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - APIFY_TOKEN=${APIFY_TOKEN}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_IG_USER_ID=${META_IG_USER_ID}
      - META_GRAPH_VERSION=${META_GRAPH_VERSION:-v21.0}
    volumes:
      - ../../:/repo                         # the Zinga OS repo, read/write in-container
      - claude_home:/home/worker/.claude     # persist Claude auth/token across restarts

volumes:
  n8n_data:
  claude_home:
  caddy_data:
  caddy_config:
